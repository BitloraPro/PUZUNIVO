name: PUZUNIVO source verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript modules
        run: npm run check
      - name: Run PUZUNIVO and MegaRush regression tests
        run: npm test
      - name: Run Apper frontend included engine tests
        run: node --test apper-app/tests/*.test.mjs
      - name: Install Apper 3D frontend dependencies
        working-directory: apper-app
        run: npm install --no-audit --no-fund
      - name: Build local MegaRush entrypoint
        working-directory: apper-app
        run: npm run megarush:build
