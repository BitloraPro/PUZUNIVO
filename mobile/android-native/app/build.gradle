plugins {
    id 'com.android.application'
}
android {
    namespace 'com.puzunivo.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.puzunivo.game'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.5.3-dev'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Do not ship unsigned / claim production readiness; configure your keystore separately.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
